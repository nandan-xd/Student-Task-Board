<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Task Board{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            background-color: #eff2f7;
            min-height: 100vh;
        }
        .navbar-brand {
            font-weight: 700;
        }
        .content-wrapper {
            padding: 2.5rem 0;
        }
        .page-header {
            margin-bottom: 1.75rem;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-md navbar-dark bg-primary shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('add_tasks') }}">Task Board</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="{{ url_for('add_tasks') }}">Add Tasks</a>
        <a class="nav-link" href="{{ url_for('your_tasks') }}">Your Tasks</a>
      </div>
    </div>
  </div>
</nav>
<main class="container content-wrapper">
    <section class="page-header text-center">
        <h1 class="h3 text-dark">{% block header %}Organize your tasks clearly{% endblock %}</h1>
        <p class="text-muted">Add new tasks, view pending items, and stay on track.</p>
    </section>
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </div>
</main>
<footer class="text-center text-muted py-4 mt-4">
    <small>Student Task Board &copy; {{ current_year if current_year else '' }}</small>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-QF6tjK6iKQhE9kQ6JsS5X0bl1g/jUaE4rftgY2KypBj9X3jq4FzRRBsrJx7hxN0F" crossorigin="anonymous"></script>
</body>
</html>
